<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wörter-Sammler</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c6fe8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Konzept: Sammelalbum auf dem Handy in Blau. Große Tippflächen, ruhige Oberfläche, Gold nur für Belohnungen. */
:root{
  --bg:#eef4fd;--surface:#fff;--surface-2:#e1ebfa;--ink:#0f2144;--muted:#566a8c;--line:#cfdcf0;
  --accent:#1c6fe8;--accent-2:#38b6ff;--accent-dark:#0b3a8f;--accent-ink:#fff;--accent-soft:#d9e8fd;
  --gold:#f5b800;--gold-ink:#3a2a00;
  --good:#147a52;--good-bg:#dcf4e8;--bad:#c4352b;--bad-bg:#fde4e1;--warn:#7d5200;--warn-bg:#fff0c4;
  --r-n:#7d8fae;--r-s:#0e9f8f;--r-e:#7a3fd9;--r-l:#e0a000;
  --shadow:0 1px 0 rgba(15,33,68,.06),0 6px 18px rgba(15,33,68,.08);
  --font:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1530;--surface:#12234a;--surface-2:#1b2f63;--ink:#eaf1ff;--muted:#9db0d6;--line:#2a4079;
  --accent:#5aa2ff;--accent-2:#7fd0ff;--accent-dark:#1a4aa8;--accent-ink:#06142e;--accent-soft:#1d3a75;
  --good:#4cd49b;--good-bg:#12352a;--bad:#ff8077;--bad-bg:#401a1a;--warn:#ffd36b;--warn-bg:#3d3010;
  --shadow:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
body.immersive #app{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.immersive nav{display:none}
h1,h2,h3{margin:0 0 6px;line-height:1.2}
h2{font-size:22px}h3{font-size:17px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.center{text-align:center}.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.spread{justify-content:space-between}
.grow{flex:1}
.panel{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;font-size:17px;background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
button:focus-visible,.in:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:800;white-space:nowrap;cursor:pointer;min-height:42px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 8px;font:inherit;font-weight:800;font-size:16px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg svg,.mic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg svg{width:22px;height:22px}
.bar{height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.bar.gold>i{background:linear-gradient(90deg,#f5b800,#ff9d3d)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--surface);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.pill.gold{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:14px}
.packbox{display:flex;gap:14px;align-items:center}
.packimg{position:relative;flex:none;width:68px}
.packimg img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.packimg .badge{position:absolute;right:-10px;top:-8px;z-index:1}
.packdef{width:100%;aspect-ratio:307/560;border-radius:10px;background:linear-gradient(160deg,var(--accent),var(--accent-dark));position:relative;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.packdef::after{content:"";position:absolute;inset:8%;border:2px solid rgba(255,255,255,.55);border-radius:6px}
.packbig{display:block;margin:14px auto;background:none;border:0;padding:0;width:min(62vw,250px);cursor:pointer;animation:wobble 1.8s ease-in-out infinite}
.packbig img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
@keyframes wobble{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.subhead{width:100%;appearance:none;border:0;background:var(--accent-soft);color:var(--ink);font:inherit;font-weight:900;font-size:16px;padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-top:18px;cursor:pointer;min-height:48px}
/* Formulare */
.field{margin:0 0 12px}
.field>label{display:block;font-weight:800;font-size:14px;margin-bottom:4px;color:var(--muted)}
.in{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;min-height:48px}
textarea.in{resize:vertical;min-height:120px}
.in:focus{border-color:var(--accent);outline:none}
.chk{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-weight:700;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.tog{appearance:none;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;min-height:40px;background:var(--surface-2);color:var(--muted);cursor:pointer;flex:none}
.tog.on{background:var(--good-bg);color:var(--good)}
/* Lernen */
.qtop{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.icon-btn{appearance:none;border:0;background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:var(--shadow);flex:none}
.qcard{background:var(--surface);border-radius:22px;padding:26px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.qlabel{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:8px}
.qword{font-size:clamp(30px,9vw,44px);font-weight:900;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.qhint{margin-top:12px;font:800 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;white-space:pre;color:var(--accent);overflow-x:auto}
.ans{font-size:22px;font-weight:800;text-align:center;min-height:60px}
.mic{appearance:none;border:0;width:112px;height:112px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:4px auto 10px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.mic svg{width:50px;height:50px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.fb{border-radius:18px;padding:16px;margin-bottom:14px;font-weight:700}
.fb h3{font-size:22px;margin-bottom:4px}
.fb.right{background:var(--good-bg);color:var(--good)}
.fb.almost{background:var(--warn-bg);color:var(--warn)}
.fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb .corr{font-size:24px;font-weight:900;color:var(--ink);overflow-wrap:anywhere}
.big{font-size:56px;font-weight:900;line-height:1}
/* Vokabelliste */
.lt{padding:0;overflow:hidden}
.lrow{display:grid;grid-template-columns:1.1fr 1.1fr .8fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;overflow-wrap:anywhere}
.lrow:last-child{border:0}
.lhead{background:var(--accent-soft);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.lhead button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-weight:900;font-size:14px;text-align:left;padding:6px 0;cursor:pointer;min-height:40px}
/* Karten */
.tcard{position:relative;aspect-ratio:63/88;border-radius:11px;background:#fff;overflow:hidden;border:3px solid var(--rc,var(--r-n));box-shadow:0 3px 0 rgba(0,0,0,.14)}
.tcard img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.tcard .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;font-weight:800;line-height:1.15;display:flex;justify-content:space-between;gap:4px;align-items:flex-end}
.tcard .cap span{color:#ffd45c;white-space:nowrap}
.tcard .cnt{position:absolute;right:5px;top:5px}
.tcard .new{position:absolute;left:5px;top:5px;background:#e8332a;color:#fff;font-weight:900;font-size:11px;border-radius:99px;padding:2px 8px}
.tcard.rw{background:linear-gradient(160deg,var(--surface),var(--surface-2));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:14px 8px}
.tcard.rw .rl{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.tcard.rw .rt{font-size:16px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.tcard.rw .st{color:#e0a000;font-size:14px}
.tcard.r-l::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 3s linear infinite;pointer-events:none}
.tcard.unk{background:var(--surface-2);border-color:var(--line);display:grid;place-items:center;color:var(--muted);font-weight:900;box-shadow:none}
.tcard.unk b{font-size:28px;display:block;text-align:center}
.r-n{--rc:var(--r-n)}.r-s{--rc:var(--r-s)}.r-e{--rc:var(--r-e)}.r-l{--rc:var(--r-l)}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button.tile{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.packgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.flip{appearance:none;border:0;background:none;padding:0;perspective:900px;aspect-ratio:63/88;cursor:pointer;width:100%}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px}
.face.front{transform:rotateY(180deg)}
.face.back{background:radial-gradient(circle at 50% 50%,#fff 0 11%,transparent 12%),radial-gradient(circle at 50% 50%,transparent 0 22%,rgba(255,255,255,.55) 23% 25%,transparent 26%),repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 9px,transparent 9px 18px),linear-gradient(160deg,var(--accent),var(--accent-dark));border:3px solid rgba(255,255,255,.7);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.flip.on.hi .face.front{animation:glow 1.4s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--r-l)}40%{box-shadow:0 0 28px 8px var(--r-l)}100%{box-shadow:0 0 0 0 transparent}}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
nav div{max-width:560px;margin:0 auto;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer;min-height:54px}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.themesel{appearance:none;width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 14px;font:inherit;font-weight:800;font-size:17px;min-height:54px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
.themelist{margin-top:8px;border:2px solid var(--line);border-radius:14px;overflow:hidden;max-height:50vh;overflow-y:auto}
.theme{appearance:none;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font:inherit;font-weight:800;font-size:17px;min-height:52px;width:100%;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
.theme:last-child{border-bottom:0}
.theme.on{background:var(--accent-soft)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-block}
nav button.on{color:var(--accent-text,var(--accent));background:var(--accent-soft)}
/* Eltern */
.sechead{width:100%;appearance:none;border:0;background:var(--surface);color:var(--ink);font:inherit;font-weight:900;font-size:18px;padding:14px 16px;border-radius:16px;text-align:left;display:flex;justify-content:space-between;margin-top:10px;box-shadow:var(--shadow);cursor:pointer;min-height:52px;align-items:center}
.secbody{background:var(--surface);border-radius:0 0 16px 16px;padding:14px 16px;margin-top:-10px;box-shadow:var(--shadow)}
.sechead.on{border-radius:16px 16px 0 0;position:relative;z-index:1}
.urow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border:0}
.urow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.wrow{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:15px}
.wrow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{appearance:none;border:0;background:var(--bad-bg);color:var(--bad);border-radius:10px;width:36px;height:36px;font-weight:900;cursor:pointer;flex:none}
.x.edit{background:var(--accent-soft);color:var(--accent-text,var(--accent))}
.note{font-size:13px;color:var(--muted)}
.busy{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:8px 12px;font-weight:800;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(5,12,32,.74);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.mbox{background:var(--surface);border-radius:20px;padding:18px;width:100%;max-width:340px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:800;font-size:15px;z-index:30;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div>
  <button data-a="nav" data-v="home" id="n-home"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Lernen</button>
  <button data-a="nav" data-v="album" id="n-album"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M9 21h10a1 1 0 0 0 1-1V8"/></svg>Album</button>
  <button data-a="nav" data-v="options" id="n-options"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.7 0 2-1.2 1.4-2.2-.7-1.2.1-2.3 1.4-2.3H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>Optionen</button>
  <button data-a="nav" data-v="parent" id="n-parent"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Eltern</button>
</div></nav>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ================= LOGIK (ohne Oberfläche, wird separat getestet) ================= */
//LOGIC-START
const DAY=86400000;
const BOX_DAYS=[0,0,1,3,7,14];
const RARITIES=[
  {k:'n',label:'Normal',w:62,stars:1},
  {k:'s',label:'Selten',w:26,stars:2},
  {k:'e',label:'Episch',w:10,stars:3},
  {k:'l',label:'Legendär',w:2,stars:4}
];
function norm(s){
  return String(s).normalize('NFC').toLowerCase().trim().replace(/[.!?¡¿,]+$/g,'').replace(/\s+/g,' ').trim();
}
function variants(ans){
  const out=new Set();
  String(ans).split(/\s*[\/;]\s*/).forEach(part=>{
    part=part.trim(); if(!part) return;
    const forms=[part,part.replace(/\([^)]*\)/g,' '),part.replace(/[()]/g,'')];
    forms.forEach(f=>{
      const n=norm(f); if(!n) return;
      out.add(n);
      if(n.startsWith('to ')) out.add(n.slice(3));
    });
  });
  return [...out];
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function checkAnswer(input,answer){
  const x=norm(input); if(!x) return 'wrong';
  const vs=variants(answer);
  if(vs.includes(x)) return 'right';
  for(const v of vs){
    const tol=v.length>=8?2:(v.length>=4?1:0);
    if(tol&&lev(x,v)<=tol) return 'almost';
  }
  return 'wrong';
}
/* Gesprochene Antwort: mehrere Erkennungsvarianten; ein ganzes Wort im Satz zählt ("the dog"). */
function evalSpeech(alts,answer){
  let best='wrong';
  const vs=variants(answer);
  for(const t of alts){
    const k=checkAnswer(t,answer);
    if(k==='right') return 'right';
    const x=' '+norm(t)+' ';
    if(vs.some(v=>x.includes(' '+v+' '))) return 'right';
    if(k==='almost') best='almost';
  }
  return best;
}
function dueFor(box,now){return box<=1?now:now+BOX_DAYS[box]*DAY}
function applyFirstTry(w,kind,hinted,now){
  w.seen=(w.seen||0)+1;
  if(kind==='right'&&!hinted){w.right=(w.right||0)+1;w.box=Math.min(5,(w.box||1)+1);w.due=dueFor(w.box,now);}
  else if(kind==='right'||kind==='almost'){w.due=now;}
  else{w.wrong=(w.wrong||0)+1;w.box=1;w.due=now;}
}
function pickSession(vocab,unit,size,now,rnd){
  rnd=rnd||Math.random;
  const pool=vocab.filter(w=>!unit||w.unit===unit);
  const sc=w=>(6-w.box)*10+Math.min(w.wrong||0,5)*2+((w.seen||0)===0?4:0)+rnd()*8;
  const due=pool.filter(w=>w.due<=now).map(w=>({w,s:sc(w)})).sort((a,b)=>b.s-a.s).map(o=>o.w);
  let pick=due.slice(0,size);
  if(pick.length<size){
    const rest=pool.filter(w=>w.due>now).map(w=>({w,r:rnd()})).sort((a,b)=>a.w.due-b.w.due||a.r-b.r).map(o=>o.w);

  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.roundRect(28,28,304,380,22);g.fill();
  g.font='190px system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#000';g.fillText(emoji,180,218);
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.88));
}

function vQuiz(){
  const L=curLang(),it=Q.phase==='fb'?Q.last:Q.queue[0],w=L.vocab.find(x=>x.id===it.id);
  const speak=Q.mode==='speak',hasSR=!!SRClass();
  const q=it.dir==='f2d'?w.f:w.d,ans=it.dir==='f2d'?w.d:w.f;
  const pct=Math.round((Q.total-Q.queue.length)/Q.total*100);
  let body;
  if(Q.phase==='ask'&&!speak){
    body=`<div class="field"><input id="ans" class="in ans" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Antwort eintippen"></div>

  }else if(Q.phase==='ask'&&speak&&hasSR){
    body=`<button class="mic ${Q.listening?'on':''}" data-a="listen" aria-label="Sprechen">${ICON_MIC}</button>
    <p class="center ${Q.speechMsg?'':'muted'}" style="font-weight:700">${Q.listening?'Ich höre zu … Sprich jetzt!':(esc(Q.speechMsg)||'Tippe aufs Mikrofon und sag das Wort.')}</p>
    <div class="row"><button class="btn small grow" data-a="hint">Tipp</button><button class="btn small grow" data-a="skip">Weiß ich nicht</button></div>`;
  }else if(Q.phase==='ask'&&speak){
    body=`<p class="center muted">Sag das Wort laut. Dann zeige die Lösung und bewerte dich ehrlich.</p>
    <button class="btn primary block" style="min-height:60px;font-size:19px" data-a="show-answer">Lösung zeigen</button>`;
  }else if(Q.phase==='reveal'){
    body=`<div class="fb almost"><div class="muted" style="font-weight:700">Richtig ist:</div><div class="corr">${esc(ans)}</div></div>
    <div class="row"><button class="btn primary grow" data-a="self-yes">Hab ich gewusst</button><button class="btn grow" data-a="self-no">Nicht gewusst</button></div>`;
  }else{
    const f=Q.fb;
    const t=f.kind==='right'?(f.retry?'Richtig, gut gemerkt!':'Richtig!'):f.kind==='almost'?'Fast richtig!':'Leider nicht.';
    const sub=f.kind==='right'?(f.pts?`+${f.pts} Punkte${f.hinted?' (mit Tipp)':''}`:''):
      (f.dropped?'Das üben wir später weiter.':'Das Wort kommt gleich nochmal.');
    body=`<div class="fb ${f.kind}"><h3>${t}</h3>${f.heard?`<div class="muted" style="font-weight:700">Verstanden: „${esc(f.heard)}“</div>`:''}${f.kind!=='right'?`<div class="muted" style="font-weight:700">Richtig ist:</div><div class="corr">${esc(ans)}</div>`:''}${sub?`<div style="margin-top:6px">${sub}${f.kind==='almost'&&f.pts?` · +${f.pts} Punkte`:''}</div>`:''}</div>
    <button id="nextbtn" class="btn primary block" style="min-height:60px;font-size:19px" data-a="next">${Q.queue.length?'Weiter':'Fertig'}</button>`;
  }
  return `<div class="qtop"><button class="icon-btn" data-a="quit" aria-label="Beenden">✕</button><div class="bar grow"><i style="width:${pct}%"></i></div><span class="pill">+${Q.earned}</span></div>

}

/* ================= Lernen ================= */
function stopListen(){try{if(rec){rec.onend=null;rec.onerror=null;rec.onresult=null;rec.abort();}}catch(e){}rec=null;if(Q)Q.listening=false;}
function startQuiz(){
  const L=curLang();if(!L||!L.vocab.length)return;
  const ids=pickSession(L.vocab,ui.unit,L.sessionSize,Date.now());
  if(!ids.length){toast('Keine Wörter in dieser Liste');return;}
  const speak=S.mode==='speak';
  const dirOf=()=>speak?'d2f':(L.dir==='mix'?(Math.random()<.5?'f2d':'d2f'):L.dir);
  Q={langId:L.id,mode:speak?'speak':'write',queue:ids.map(id=>({id,dir:dirOf(),first:true,attempts:0})),total:ids.length,phase:'ask',hint:0,earned:0,rightFirst:0,packs:0,fb:null,last:null,listening:false,speechMsg:''};
  ui.view='quiz';render();
}
function resolveAnswer(kind,heard){
  const L=curLang(),it=Q.queue.shift();Q.last=it;
  const w=L.vocab.find(x=>x.id===it.id);
  let pts=0;const hinted=Q.hint>0,retry=!it.first;
  if(it.first){
    applyFirstTry(w,kind,hinted,Date.now());
    if(kind==='right'&&!hinted){pts=L.ppr;Q.rightFirst++;}
    else if(kind==='right'||kind==='almost'){pts=Math.round(L.ppr/2);}
    it.first=false;
  }
  it.attempts++;
  let dropped=false;
  if(kind!=='right'){
    if(it.attempts<3)Q.queue.splice(Math.min(2,Q.queue.length),0,it);else dropped=true;
  }
  if(pts){Q.packs+=addPoints(L,pts);Q.earned+=pts;}
  save();
  Q.fb={kind,pts,hinted,retry,dropped,heard:heard||''};Q.phase='fb';Q.speechMsg='';render();
}
function nextQuestion(){
  Q.hint=0;Q.phase='ask';Q.speechMsg='';
  if(!Q.queue.length){finishQuiz();return;}
  render();
}
function finishQuiz(){
  const t=dateKey(0),s=S.streak;Q.streakAwards=[];
  if(s.last!==t){
    s.count=(s.last===dateKey(-1))?s.count+1:1;s.last=t;
    const L=curLang();
    const c=S.streakCfg;
    if(streakDue(s.count,c.days)){
      const sp=c.nextRid&&S.rewards.find(r=>r.id===c.nextRid);
      let g=null;
      if(sp)g={kind:'text',rid:sp.id};else if(c.def.active)g=c.def.kind==='text'?(S.rewards.find(r=>r.id===c.def.rid)?{kind:'text',rid:c.def.rid}:null):{kind:'pack'};
      if(sp)c.nextRid='';
      if(g&&g.kind==='pack'){const n=c.def.packs||1;L.packs+=n;Q.streakAwards.push({kind:'pack',packs:n,days:s.count});}
      else if(g){const r=S.rewards.find(x=>x.id===g.rid);L.wins.push({id:uid(),rid:r.id,text:r.text,rarity:r.rarity,src:'streak',days:s.count,ts:Date.now(),redeemed:false});if(r.once)r.active=false;Q.streakAwards.push({kind:'text',text:r.text,days:s.count});}
    }
  }
  save();ui.view='summary';render();
}
function startListen(){
  const SRC=SRClass();if(!SRC||!Q)return;
  if(Q.listening){try{rec.stop();}catch(e){}return;}
  const L=curLang();let got=null,err='';
  rec=new SRC();rec.lang=resolveSpeechLang(L);rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  rec.onresult=e=>{got=[...e.results[0]].map(a=>a.transcript);};
  rec.onerror=e=>{err=e.error||'';};
  rec.onend=()=>{
    Q.listening=false;rec=null;
    if(got&&got.length){
      const it=Q.queue[0],w=L.vocab.find(x=>x.id===it.id);
      resolveAnswer(evalSpeech(got,it.dir==='f2d'?w.d:w.f),got[0]);return;
    }
    Q.speechMsg=(err==='not-allowed'||err==='service-not-allowed')?'Das Mikrofon ist nicht erlaubt. Erlaube es in den Chrome-Einstellungen für diese Seite.'
      :err==='network'?'Dafür brauchst du Internet.':'Ich habe nichts gehört. Versuch es nochmal.';
    render();
  };
  try{rec.start();Q.listening=true;Q.speechMsg='';render();}catch(e){Q.speechMsg='Das hat nicht geklappt. Versuch es nochmal.';render();}
}

function openPack(){
  const L=curLang();if(!L||L.packs<1)return;
  const pool=L.cards.concat(rewardsFor(L));
  if(!pool.length){toast('Noch keine Karten im Album. Bitte Mama oder Papa fragen.');return;}
  const drawn=drawCards(pool,L.packSize);
  L.packs--;
  const items=drawn.map(c=>{
    if(c.kind==='reward'){
      L.wins.push({id:uid(),rid:c.id,text:c.text,rarity:c.rarity,ts:Date.now(),redeemed:false});
      if(c.once)c.active=false;
      return {card:c,isNew:true,on:false};
    }
    const isNew=!(L.owned[c.id]>0);L.owned[c.id]=(L.owned[c.id]||0)+1;return {card:c,isNew,on:false};
  });
  save();ui.pack={items,opened:false};ui.view='pack';render();
}

async function importZip(f){
  const L=curLang();let n=0;
  try{
    const list=zipList(await f.arrayBuffer()).filter(en=>zipImage(en.name));
    for(const en of list){
      setBusy(`Importiere ${n+1} von ${list.length} …`);
      try{
        const data=await zipData(en);
        const blob=await fileToBlob(new Blob([data],{type:zipImage(en.name)}));
        const id=uid();await putImg(id,blob);
        L.cards.push({id,name:cleanCardName(en.name.split('/').pop()),rarity:zipRarity(en.name,ui.imprar)});n++;
      }catch(e){}
    }
  }catch(e){setBusy('');toast('Die ZIP-Datei konnte nicht gelesen werden.');return;}
  return n;
}
async function importFiles(files){
  const L=curLang();if(!L||!files.length)return;
  const zips=files.filter(f=>/\.zip$/i.test(f.name)),imgs=files.filter(f=>!/\.zip$/i.test(f.name));
  let n=0;
  for(const z of zips){const k=await importZip(z);if(k===undefined)return;n+=k;}
  files=imgs;
  let i=0;
  for(const f of files){
    setBusy(`Importiere ${++i} von ${files.length} …`);
    try{const blob=await fileToBlob(f);const id=uid();await putImg(id,blob);L.cards.push({id,name:cleanCardName(f.name),rarity:ui.imprar});n++;}catch(e){}
  }
  save();setBusy('');toast(n+' Karten hinzugefügt');render();
}
function setBusy(t){ui.busy=t;const b=$('#busy');if(b){b.textContent=t;b.hidden=!t;}}
async function addStarter(){
  const L=curLang();if(!L)return;
  setBusy('Karten werden erstellt …');
  for(const [emoji,name,r,color] of STARTER){const id=uid();await putImg(id,await starterBlob(emoji,color));L.cards.push({id,name,rarity:r});}
  save();setBusy('');toast('12 Platzhalter-Karten hinzugefügt');render();
}
function clamp(v,a,b){v=Math.round(Number(v));if(!isFinite(v))v=a;return Math.min(b,Math.max(a,v));}
const val=sel=>{const e=$(sel);return e?e.value:'';};

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const d=el.dataset,L=curLang();
  switch(d.a){
    case 'nav':if(Q&&Q.listening)stopListen();if(ui.view==='parent'&&d.v!=='parent')ui.unlocked=false;ui.view=d.v;ui.modal=null;ui.pinErr='';render();break;
    case 'lang':S.activeLang=d.id;ui.unit='';ui.lf='';save();render();break;
    case 'unit':ui.unit=d.u;render();break;
    case 'mode':S.mode=d.m==='speak'?'speak':'write';save();render();break;
    case 'start':startQuiz();break;
    case 'quit':stopListen();ui.view='home';render();break;
    case 'show-list':ui.view='list';render();break;
    case 'list-sort':ui.ls=ui.ls.col===d.c?{col:d.c,dir:-ui.ls.dir}:{col:d.c,dir:1};render();break;
    case 'list-filter':ui.lf=d.u;render();break;
    case 'check':{
      const v=val('#ans');
      if(!v.trim()){toast('Schreibe zuerst eine Antwort.');break;}
      const it=Q.queue[0],w=L.vocab.find(x=>x.id===it.id);
      resolveAnswer(checkAnswer(v,it.dir==='f2d'?w.d:w.f));break;}
    case 'skip':stopListen();resolveAnswer('wrong');break;
    case 'listen':startListen();break;
    case 'show-answer':Q.phase='reveal';render();break;
    case 'self-yes':resolveAnswer('right');break;
    case 'self-no':resolveAnswer('wrong');break;
    case 'hint':{
      const it=Q.queue[0],w=L.vocab.find(x=>x.id===it.id);
      const letters=[...primaryAnswer(it.dir==='f2d'?w.d:w.f)].filter(c=>c!==' ').length;
      if(Q.hint<letters-1)Q.hint++;
      const v=val('#ans');render();const a=$('#ans');if(a){a.value=v;a.focus();}break;}
    case 'next':nextQuestion();break;
    case 'open-pack':openPack();break;
    case 'tear':ui.pack.opened=true;if(navigator.vibrate)navigator.vibrate(30);render();break;
    case 'flip':{
      const it=ui.pack.items[+d.i];if(it.on)break;
      it.on=true;el.classList.add('on');
      if(it.card.kind==='reward'||it.card.rarity==='e'||it.card.rarity==='l'){if(navigator.vibrate)navigator.vibrate(40);}
      $('#packact').innerHTML=packActions();
      if(ui.pack.items.every(i=>i.on))$('#packhint').textContent='Das sind deine neuen Karten!';
      break;}
    case 'flip-all':{
      ui.pack.items.forEach(i=>i.on=true);
      document.querySelectorAll('.flip').forEach(f=>f.classList.add('on'));
      $('#packact').innerHTML=packActions();$('#packhint').textContent='Das sind deine neuen Karten!';break;}
    case 'view-card':ui.modal={t:'view',id:d.id};render();break;
    case 'edit-card':ui.modal={t:'edit',id:d.id};render();break;
    case 'close-modal':ui.modal=null;ui.confirm=null;render();break;
    case 'backdrop':if(e.target===el){ui.modal=null;ui.confirm=null;render();}break;
    case 'save-card':{
      const c=L.cards.find(x=>x.id===d.id);if(!c)break;
      c.name=val('#ced-name').trim()||c.name;c.rarity=val('#ced-rar');
      save();ui.modal=null;render();break;}
    case 'del-card':{
      if(!ask(d.key))break;
      const id=d.key.split(':')[1];L.cards=L.cards.filter(c=>c.id!==id);delete L.owned[id];await delImg(id);
      save();ui.modal=null;render();break;}
    case 'pin-set':{
      const a=val('#pin1'),b=val('#pin2');
      if(!/^\d{4,8}$/.test(a)){ui.pinErr='Die PIN braucht 4 bis 8 Ziffern.';render();break;}
      if(a!==b){ui.pinErr='Die beiden PINs sind verschieden.';render();break;}
      S.pinHash=hashPin(a);save();ui.unlocked=true;ui.pinErr='';render();break;}
    case 'pin-go':{
      if(hashPin(val('#pin'))===S.pinHash){ui.unlocked=true;ui.pinErr='';}else ui.pinErr='Falsche PIN.';
      render();break;}
    case 'pin-change':{
      const a=val('#pn1');
      if(!/^\d{4,8}$/.test(a)){toast('Die PIN braucht 4 bis 8 Ziffern.');break;}
      S.pinHash=hashPin(a);save();$('#pn1').value='';toast('PIN geändert');break;}
    case 'lock':ui.unlocked=false;render();break;
    case 'sec':ui.sec=ui.sec===d.k?'':d.k;render();break;
    case 'add-lang':{
      const n=val('#newlang').trim();if(!n){toast('Bitte einen Namen eingeben.');break;}
      const nl=newLang(n);S.langs.push(nl);S.activeLang=nl.id;save();render();toast(n+' angelegt');break;}
    case 'del-lang':{
      if(!ask(d.key))break;
      const id=d.key.split(':')[1],l=S.langs.find(x=>x.id===id);
      if(l)for(const c of l.cards)await delImg(c.id);
      S.langs=S.langs.filter(x=>x.id!==id);S.rewards=S.rewards.filter(r=>r.lang!==id);
      if(S.activeLang===id)S.activeLang=S.langs[0]?S.langs[0].id:null;
      save();render();break;}
    case 'add-vocab':{
      if(!L)break;
      const {items,skipped}=parseVocab(ui.vtext);
      if(!items.length){toast('Keine Zeile mit „=“ gefunden.');break;}
      const unit=(ui.vunit||'').trim()||'Allgemein';let n=0,dup=0;
      for(const it of items){
        if(L.vocab.some(w=>w.unit===unit&&w.f.toLowerCase()===it.f.toLowerCase()&&w.d.toLowerCase()===it.d.toLowerCase())){dup++;continue;}
        L.vocab.push({id:uid(),f:it.f,d:it.d,unit,box:1,due:0,seen:0,right:0,wrong:0});n++;
      }
      ui.vtext='';save();render();
      toast(n+' hinzugefügt'+(dup?`, ${dup} doppelt`:'')+(skipped?`, ${skipped} Zeile(n) übersprungen`:''));break;}
    case 'theme':S.theme=THEMES.some(t=>t.k===d.k)?d.k:'blau';ui.themeOpen=false;save();render();break;
    case 'theme-toggle':ui.themeOpen=!ui.themeOpen;render();break;
    case 'toggle-cats':ui.cats=!ui.cats;render();break;
    case 'open-unit':ui.openUnit=ui.openUnit===d.u?'':d.u;render();break;
    case 'rename-unit':ui.modal={t:'unit',u:d.u};render();break;
    case 'save-unit':{
      const nn=val('#ue-name').trim();if(!nn){toast('Der Name darf nicht leer sein.');break;}
      L.vocab.forEach(w=>{if(w.unit===d.u)w.unit=nn;});
      if(ui.openUnit===d.u)ui.openUnit=nn;ui.unit='';ui.lf='';ui.modal=null;save();render();toast('Umbenannt');break;}
    case 'del-unit':{
      if(!ask(d.key))break;
      const u=d.key.slice('del-unit:'.length);L.vocab=L.vocab.filter(w=>w.unit!==u);if(ui.openUnit===u)ui.openUnit='';save();render();break;}
    case 'edit-word':ui.modal={t:'word',id:d.id};render();break;
    case 'save-word':{
      const w=L.vocab.find(x=>x.id===d.id);if(!w)break;
      const f=val('#we-f').trim(),dd=val('#we-d').trim(),u=val('#we-u').trim();
      if(!f||!dd){toast('Beide Wörter müssen ausgefüllt sein.');break;}
      w.f=f;w.d=dd;w.unit=u||'Allgemein';save();ui.modal=null;render();toast('Gespeichert');break;}
    case 'del-wordm':{
      if(!ask(d.key))break;
      const id=d.key.split(':')[1];L.vocab=L.vocab.filter(w=>w.id!==id);save();ui.modal=null;render();break;}
    case 'del-word':L.vocab=L.vocab.filter(w=>w.id!==d.id);save();render();break;
    case 'reset-learn':{
      if(!ask(d.key))break;
      L.vocab.forEach(w=>{w.box=1;w.due=0;w.seen=0;w.right=0;w.wrong=0;});save();render();toast('Lernstand zurückgesetzt');break;}
    case 'add-prize':{
      const text=val('#pz-text').trim();if(!text){toast('Bitte einen Text eingeben.');break;}
      S.rewards.push({id:uid(),kind:'reward',text,rarity:val('#pz-rar')||'s',lang:val('#pz-scope')==='all'?'all':L.id,active:true,once:!!($('#pz-once')&&$('#pz-once').checked)});
      save();render();toast('Belohnung hinterlegt');break;}
    case 'toggle-prize':{
      const r=S.rewards.find(x=>x.id===d.id);if(r){r.active=!r.active;save();render();}break;}
    case 'edit-prize':ui.modal={t:'prize',id:d.id};render();break;
    case 'save-prize':{
      const r=S.rewards.find(x=>x.id===d.id);if(!r)break;
      const text=val('#pe-text').trim();if(!text){toast('Der Text darf nicht leer sein.');break;}
      r.text=text;r.rarity=val('#pe-rar')||r.rarity;r.lang=val('#pe-scope')==='all'?'all':L.id;r.once=!!($('#pe-once')&&$('#pe-once').checked);
      save();ui.modal=null;render();break;}
    case 'del-prize':{
      if(!ask(d.key))break;
      const id=d.key.split(':')[1];S.rewards=S.rewards.filter(r=>r.id!==id);save();ui.modal=null;render();break;}
    case 'redeem':{
      const w=L.wins.find(x=>x.id===d.id);if(w){w.redeemed=true;w.redeemedTs=Date.now();save();render();}break;}
    case 'toggle-sdef':S.streakCfg.def.active=!S.streakCfg.def.active;save();render();break;
    case 'del-packimg':{if(!ask(d.key))break;await delImg(PACK_KEY);render();toast('Standard-Päckchen wird gezeigt');break;}
    case 'starter':addStarter();break;
    case 'gift':if(L){L.packs++;save();toast('1 Päckchen geschenkt');}break;
    case 'export':exportBackup();break;
    case 'import-yes':applyImport();break;
    case 'import-no':ui.pendingImport=null;render();break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render();}break;
  }
});
document.addEventListener('change',async e=>{
  const el=e.target,k=el.dataset&&el.dataset.change;if(!k)return;
  const L=curLang();
  if(k==='imprar')ui.imprar=el.value;
  else if(k==='scfg'){
    const c=S.streakCfg,key=el.dataset.k;
    if(key==='days')c.days=clamp(el.value,1,365);
    else if(key==='kind')c.def.kind=el.value==='text'?'text':'pack';
    else if(key==='packs')c.def.packs=clamp(el.value,1,10);
    else if(key==='rid')c.def.rid=el.value;
    else if(key==='next')c.nextRid=el.value;
    save();render();
  }
  else if(k==='packimg'){
    const f=el.files[0];el.value='';if(!f)return;
    try{const b=await packImageBlob(f);await putImg(PACK_KEY,b);toast('Päckchen-Bild gespeichert');}catch(err){toast('Das Bild konnte nicht gelesen werden.');}
    render();
  }
  else if(k==='files'){const files=[...el.files];el.value='';await importFiles(files);}
  else if(k==='set'&&L){
    const key=el.dataset.k;
    if(key==='goal')L.goal=clamp(el.value,10,2000);
    else if(key==='ppr')L.ppr=clamp(el.value,1,100);
    else if(key==='packSize')L.packSize=clamp(el.value,1,9);
    else if(key==='sessionSize')L.sessionSize=clamp(el.value,3,50);
    else if(key==='dir')L.dir=el.value;
    else if(key==='speechLang')L.speechLang=el.value;
    while(L.points>=L.goal){L.points-=L.goal;L.packs++;}
    save();render();toast('Gespeichert');
  }else if(k==='import'){
    const f=el.files[0];el.value='';if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(d.app!=='woerter-sammler'||!d.state||!Array.isArray(d.state.langs))throw new Error('x');
      ui.pendingImport=d;render();
    }catch(err){toast('Das ist keine gültige Sicherung.');}
  }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.input;
  if(k==='vtext')ui.vtext=e.target.value;else if(k==='vunit')ui.vunit=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(ui.view==='quiz'&&Q){
    if(Q.phase==='ask'&&Q.mode==='write'){e.preventDefault();const b=document.querySelector('[data-a="check"]');if(b)b.click();}
    else if(Q.phase==='fb'){e.preventDefault();nextQuestion();}
  }
  else if(ui.view==='parent'&&!ui.unlocked){const b=document.querySelector('[data-a="pin-go"],[data-a="pin-set"]');if(b)b.click();}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});

/* ================= Start ================= */
(async function init(){
  try{db=await idbOpen();const all=await idbAll();for(const id of Object.keys(all)){BLOBS[id]=all[id];IMG[id]=URL.createObjectURL(all[id]);}}catch(e){db=null;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  save();render();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
